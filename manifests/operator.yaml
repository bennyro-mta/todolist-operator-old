apiVersion: v1
kind: Namespace
metadata:
  name: todolist-operator-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist-operator
  namespace: todolist-operator-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: todolist-operator-role
rules:
- apiGroups:
  - todolist.example.com
  resources:
  - todolists
  - todolists/status
  - todolists/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  - configmaps
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: todolist-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: todolist-operator-role
subjects:
- kind: ServiceAccount
  name: todolist-operator
  namespace: todolist-operator-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-operator
  namespace: todolist-operator-system
  labels:
    app: todolist-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist-operator
  template:
    metadata:
      labels:
        app: todolist-operator
    spec:
      serviceAccountName: todolist-operator
      # imagePullSecrets:
      # - name: ghcr-mta-secret
      containers:
      - name: manager
        image: ghcr.io/bennyro-mta/todolist-operator:latest
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
