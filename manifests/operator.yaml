apiVersion: v1
kind: Namespace
metadata:
  name: todolist-operator-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-operator
  namespace: todolist-operator-system
  labels:
    app: todolist-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist-operator
  template:
    metadata:
      labels:
        app: todolist-operator
    spec:
      serviceAccountName: todolist-operator
      containers:
      - name: manager
        image: todolist-operator:latest
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
