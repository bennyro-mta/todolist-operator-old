apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist-operator
  namespace: todolist-operator-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: todolist-operator-role
rules:
- apiGroups:
  - todolist.example.com
  resources:
  - todolists
  - todolists/status
  - todolists/finalizers
  - todos
  - todos/status
  - todos/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  - configmaps
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: todolist-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: todolist-operator-role
subjects:
- kind: ServiceAccount
  name: todolist-operator
  namespace: todolist-operator-system
